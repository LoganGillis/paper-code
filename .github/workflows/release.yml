name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: file:./prisma/dev.db

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Do not publish here. arm64 and x64 publish at the same time and GitHub
      # ends up with two releases for one tag, so one feed 404s.
      - run: pnpm exec electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-dist
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          grep -q "version: ${VERSION}" dist/latest.yml
          grep -q "version: ${VERSION}" dist/latest-mac.yml
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/latest.yml dist/latest-mac.yml dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap --clobber
          else
            gh release create "$TAG" dist/latest.yml dist/latest-mac.yml dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap --title "$VERSION" --notes ""
          fi
          gh api "repos/LoganGillis/paper-code/releases/latest" > /tmp/paper-release.json
          VERSION="$VERSION" python3 - << 'PY'
          import json, os, sys
          rel = json.load(open("/tmp/paper-release.json", encoding="utf-8"))
          version = os.environ["VERSION"]
          names = {asset["name"] for asset in rel["assets"]}
          need = ["latest.yml", "latest-mac.yml", f"Paper-{version}-setup.exe"]
          missing = [name for name in need if name not in names]
          if missing:
              print("latest release is missing", ", ".join(missing))
              sys.exit(1)
          print("latest", rel["tag_name"], "has", ", ".join(sorted(names)))
          PY
