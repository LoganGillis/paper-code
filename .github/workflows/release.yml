name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: file:./prisma/dev.db

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publish after macOS so both land on one release. A second v* release
      # makes releases/download/vX/latest.yml 404, and Windows stays on the last feed it could read.
      - run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Put the Windows feed on the tag release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          grep -q "version: ${VERSION}" dist/latest.yml
          gh release upload "$TAG" \
            "dist/latest.yml" \
            "dist/Paper-${VERSION}-setup.exe" \
            "dist/Paper-${VERSION}-setup.exe.blockmap" \
            --clobber
          gh api "repos/LoganGillis/paper-code/releases/tags/${TAG}" > /tmp/paper-release.json
          export VERSION
          python - <<'PY'
          import json, os, sys
          rel = json.load(open("/tmp/paper-release.json", encoding="utf-8"))
          version = os.environ["VERSION"]
          names = {asset["name"] for asset in rel["assets"]}
          need = ["latest.yml", f"Paper-{version}-setup.exe", f"Paper-{version}-setup.exe.blockmap"]
          missing = [name for name in need if name not in names]
          if missing:
              print("Windows update feed is missing from the tag release:", ", ".join(missing))
              sys.exit(1)
          print("tag release", rel["tag_name"], "has", ", ".join(need))
          PY
