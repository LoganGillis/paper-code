appId: com.logangillis.paper
productName: Paper
copyright: Copyright © 2026 Logan Gillis
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,AGENTS.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json,prisma.config.ts}'
  - '!prisma/dev.db'
  - '!prisma/dev.db-journal'
asarUnpack:
  - resources/**
  - '**/*.{node,dll,dylib,so}'
  - '**/better-sqlite3/**'
  - '**/bindings/**'
beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
extraResources:
  - from: prisma/migrations
    to: prisma/migrations
win:
  executableName: Paper
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Paper-${version}-setup.${ext}
  shortcutName: Paper
  uninstallDisplayName: Paper
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleName: Paper
    CFBundleDisplayName: Paper
    NSDocumentsFolderUsageDescription: Paper can open CSV files from your Documents folder.
    NSDownloadsFolderUsageDescription: Paper can open CSV files from your Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  artifactName: Paper-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Logan Gillis
  category: Utility
  icon: build/icon.png
appImage:
  artifactName: Paper-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: LoganGillis
  repo: paper-code
  releaseType: release
